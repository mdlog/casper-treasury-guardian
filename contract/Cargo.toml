[package]
edition = "2021"
name = "treasury_guardian"
version = "0.1.0"

[dependencies]
odra = { version = "2.7.0", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.7.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.7.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.7.0", features = [], default-features = false }
odra-cli = { version = "2.7.0", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.7.0", optional = true }

[[bin]]
name = "treasury_guardian_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "treasury_guardian_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "treasury_guardian_cli"
path = "bin/cli.rs"
test = false

[[bin]]
name = "deploy_testnet"
path = "bin/deploy_testnet.rs"
required-features = ["livenet"]
test = false

[[bin]]
name = "tg_cli"
path = "bin/tg_cli.rs"
required-features = ["livenet"]
test = false

[features]
livenet = ["odra-casper-livenet-env"]

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unexpected_cfgs = "allow"
